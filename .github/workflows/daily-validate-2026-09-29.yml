name: Validate daily Personal News 2026-09-29
# rerun after recency fix
on:
  push:
    branches: [chatgpt/personal-news-2026-09-29]
    paths: [.github/workflows/daily-validate-2026-09-29.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Rebuild and test
        run: |
          python tools/discovery.py audit --input .run/editorial-audit-2026-09-29.json --output state/discovery-latest.json
          python tools/news.py rebuild
          python tools/news.py validate
          python -m unittest discover -s tests -v
          node --check docs/assets/app.js
          node --check docs/assets/reader.js
          python tests/browser_check.py
          python tests/browser_v2.py
          python tests/browser_reader.py
      - name: Collect generated files
        run: |
          mkdir -p generated/config generated/docs/data generated/state
          cp config/article.schema.json generated/config/
          cp config/edition.schema.json generated/config/
          cp docs/data/article-index.json generated/docs/data/
          cp docs/data/index.json generated/docs/data/
          cp docs/data/search.json generated/docs/data/
          cp state/seen.json generated/state/
          cp state/event-index.json generated/state/
          cp state/discovery-latest.json generated/state/
      - uses: actions/upload-artifact@v4
        with:
          name: daily-generated-2026-09-29
          path: generated/
          retention-days: 1
