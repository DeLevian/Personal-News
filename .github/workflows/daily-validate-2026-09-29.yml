name: Validate daily Personal News 2026-09-29
# rerun after recency fix
on:
  push:
    branches: [chatgpt/personal-news-2026-09-29]
    paths: [.github/workflows/daily-validate-2026-09-29.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Rebuild and test
        run: |
          python tools/discovery.py audit --input .run/editorial-audit-2026-09-29.json --output state/discovery-latest.json
          python tools/news.py rebuild
          python tools/news.py validate
          python -m unittest discover -s tests -v
          node --check docs/assets/app.js
          node --check docs/assets/reader.js
          python tests/browser_check.py
          python tests/browser_v2.py
          python tests/browser_reader.py
      - name: Collect generated files
        run: |
          mkdir -p generated/config generated/docs/data generated/state
          cp config/article.schema.json generated/config/
          cp config/edition.schema.json generated/config/
          cp docs/data/article-index.json generated/docs/data/
          cp docs/data/index.json generated/docs/data/
          cp docs/data/search.json generated/docs/data/
          cp state/seen.json generated/state/
          cp state/event-index.json generated/state/
          cp state/discovery-latest.json generated/state/
      - uses: actions/upload-artifact@v4
        with:
          name: daily-generated-2026-09-29
          path: generated/
          retention-days: 1
      - name: Commit generated state to this branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/chatgpt/personal-news-2026-09-29'
          cp generated/config/article.schema.json config/article.schema.json
          cp generated/config/edition.schema.json config/edition.schema.json
          cp generated/docs/data/article-index.json docs/data/article-index.json
          cp generated/docs/data/index.json docs/data/index.json
          cp generated/docs/data/search.json docs/data/search.json
          cp generated/state/seen.json state/seen.json
          cp generated/state/event-index.json state/event-index.json
          cp generated/state/discovery-latest.json state/discovery-latest.json
          rm -f .run/editorial-audit-2026-09-29.json
          git add config/article.schema.json config/edition.schema.json docs/data/article-index.json docs/data/index.json docs/data/search.json state/seen.json state/event-index.json state/discovery-latest.json .run/editorial-audit-2026-09-29.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'DeLevian'
          git config user.email '152444661+DeLevian@users.noreply.github.com'
          git commit -m 'Publish generated state for September 29 edition'
          git push origin HEAD:refs/heads/chatgpt/personal-news-2026-09-29
