name: Verify Personal News
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate data and JavaScript
        run: |
          python tools/news.py validate
          python -m unittest discover -s tests -v
          node --check docs/assets/app.js
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Test browser functionality
        run: python tests/browser_check.py
      - name: Test deployed Pages and real images
        if: always()
        run: python tests/live_check.py
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: artifacts/
          if-no-files-found: ignore
