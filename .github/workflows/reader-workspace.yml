name: Reader development workspace
on:
  push:
    branches: [chatgpt/italian-article-reader]
    paths: [.github/workflows/reader-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source only
        run: git archive --format=zip HEAD -o /tmp/personal-news-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: reader-source-workspace
          path: /tmp/personal-news-source.zip
          retention-days: 1
