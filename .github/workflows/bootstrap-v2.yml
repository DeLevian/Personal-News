name: Finalize v2 branch
on:
  push:
    branches: [chatgpt/personal-news-v2]
    paths: ['_migration/**', '.github/workflows/bootstrap-v2.yml']
permissions:
  contents: write
jobs:
  migrate:
    if: github.ref == 'refs/heads/chatgpt/personal-news-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/personal-news-v2
      - run: |
          python -m pip install -r requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Finalize and validate
        run: |
          python _migration/finish.py
          python tools/news.py rebuild
          python tools/news.py validate
          node --check docs/assets/app.js
          python -m unittest discover -s tests -v
          python tests/browser_check.py
          python tests/browser_v2.py
      - name: Commit finalized files on migration branch only
        run: |
          test "$(git branch --show-current)" = "chatgpt/personal-news-v2"
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/chatgpt/personal-news-v2 | cut -f1)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config docs state tools tests
          if ! git diff --cached --quiet; then
            git commit -m 'feat: finalize v2 catalogue, safe legacy inclusion and first Radar items'
            git push origin HEAD:refs/heads/chatgpt/personal-news-v2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-finalize-evidence
          path: artifacts/
